<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: Epic çekmecesinde yorum</title>
<style>
  body { font-family: system-ui, sans-serif; color: #333; margin: 1rem; }
  figure { margin: 0 0 1.25rem; }
  figcaption { font-size: .85rem; color: #666; margin-bottom: .35rem; }
  svg { display: block; width: 100%; max-width: 640px; height: auto; background: #f7f7f7; border: 1px solid #ccc; }
  .degisen { stroke: #c2410c; fill: #ffedd5; }
  .degisen-text { fill: #9a3412; }
</style>
</head>
<body>
<figure>
  <figcaption>Önce: çözüm onaylanınca KARAR'da yalnız "çözüm onaylandı" kalır, yorum yazılamaz. Krokinin altında yalnız "Figma'da çiz" var, krokiye not düşülemez.</figcaption>
  <svg id="once" viewBox="0 0 640 330" role="img" aria-label="Önce: yorum alanı olmayan Epic çekmecesi">
    <g font-size="11" fill="#757575"><text x="16" y="24">ÇÖZÜM</text><text x="16" y="96">UI/UX ETKİSİ</text><text x="16" y="270">KARAR</text></g>
    <g fill="#e0e0e0"><rect x="16" y="34" width="560" height="8"/><rect x="16" y="50" width="480" height="8"/><rect x="16" y="66" width="520" height="8"/></g>
    <g fill="#fff" stroke="#bdbdbd"><rect x="16" y="106" width="296" height="110"/><rect x="328" y="106" width="296" height="110"/></g>
    <g font-size="10" fill="#9e9e9e"><text x="24" y="122">önce</text><text x="336" y="122">sonra</text></g>
    <rect x="16" y="228" width="96" height="22" rx="11" fill="#fff" stroke="#bdbdbd"/><text x="28" y="243" font-size="10" fill="#424242">Figma'da çiz</text>
    <text x="16" y="292" font-size="11" fill="#616161">çözüm onaylandı</text>
  </svg>
</figure>
<figure>
  <figcaption>Sonra: krokinin altında not + "Yorum" (krokiye gider) ve "Krokiyi onayla → Figma'da çiz". Kroki yoksa yalnız "Figma'da çiz". Onaydan sonra da çözüme yorum açık; yorum onayı bozmaz.</figcaption>
  <svg id="sonra" viewBox="0 0 640 400" role="img" aria-label="Sonra: krokiye ve onaylı çözüme yorum">
    <g font-size="11" fill="#757575"><text x="16" y="24">ÇÖZÜM</text><text x="16" y="96">UI/UX ETKİSİ</text><text x="16" y="308">KARAR</text></g>
    <g fill="#e0e0e0"><rect x="16" y="34" width="560" height="8"/><rect x="16" y="50" width="480" height="8"/><rect x="16" y="66" width="520" height="8"/></g>
    <g fill="#fff" stroke="#bdbdbd"><rect x="16" y="106" width="296" height="110"/><rect x="328" y="106" width="296" height="110"/></g>
    <g font-size="10" fill="#9e9e9e"><text x="24" y="122">önce</text><text x="336" y="122">sonra</text></g>
    <!-- değişim: kroki yorumu ve onayı -->
    <rect class="degisen" x="16" y="226" width="608" height="62" rx="6"/>
    <rect x="26" y="234" width="588" height="22" fill="#fff" stroke="#c2410c"/>
    <text x="32" y="249" font-size="9" fill="#9e9e9e">krokiye not (ör. hata cümlesi alanın üstünde olsun)</text>
    <rect x="26" y="262" width="200" height="20" rx="10" fill="#c2410c"/><text x="38" y="276" font-size="10" fill="#fff">Krokiyi onayla → Figma'da çiz</text>
    <rect x="234" y="262" width="56" height="20" rx="10" fill="#fff" stroke="#c2410c"/><text x="246" y="276" font-size="10" class="degisen-text">Yorum</text>
    <text x="300" y="276" font-size="9" class="degisen-text">gönderildi</text>
    <text x="16" y="330" font-size="11" fill="#616161">çözüm onaylandı</text>
    <!-- değişim: onaydan sonra da çözüme yorum -->
    <rect class="degisen" x="16" y="340" width="608" height="52" rx="6"/>
    <rect x="26" y="348" width="588" height="20" fill="#fff" stroke="#c2410c"/>
    <text x="32" y="362" font-size="9" fill="#9e9e9e">çözüme not (onayı değiştirmez)</text>
    <rect x="26" y="372" width="56" height="16" rx="8" fill="#fff" stroke="#c2410c"/><text x="38" y="384" font-size="9" class="degisen-text">Yorum</text>
  </svg>
</figure>
</body>
</html>
