<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: iPhone uygulaması bağlantı ekranları</title>
<style>
  body { font-family: system-ui, sans-serif; color: #333; margin: 1rem; }
  figure { margin: 0 0 1.25rem; }
  figcaption { font-size: .85rem; color: #666; margin-bottom: .35rem; }
  svg { display: block; width: 100%; max-width: 640px; height: auto; background: #f7f7f7; border: 1px solid #ccc; }
  .degisen { stroke: #c2410c; fill: #ffedd5; }
  .degisen-text { fill: #9a3412; }
</style>
</head>
<body>
<figure>
  <figcaption>Önce: telefonda panel yok; Safari'de adres açılmaz.</figcaption>
  <svg id="once" viewBox="0 0 640 340" role="img" aria-label="Önce: telefonda Safari hata sayfası">
    <rect x="240" y="10" width="160" height="320" rx="18" fill="#e0e0e0" stroke="#9e9e9e"/>
    <rect x="252" y="30" width="136" height="20" fill="#bdbdbd"/>
    <text x="320" y="44" font-size="10" text-anchor="middle" fill="#424242">127.0.0.1:4747</text>
    <text x="320" y="170" font-size="11" text-anchor="middle" fill="#616161">Safari sayfayı</text>
    <text x="320" y="186" font-size="11" text-anchor="middle" fill="#616161">açamıyor</text>
  </svg>
</figure>
<figure>
  <figcaption>Sonra: panel ekranı birebir aynı, uygulama çerçevesi yok. Yalnız iki yeni ekran var: ilk açılışta adres, bağlantı yoksa hata (5 sn'de bir kendisi dener).</figcaption>
  <svg id="sonra" viewBox="0 0 640 340" role="img" aria-label="Sonra: üç telefon ekranı">
    <rect x="20" y="10" width="160" height="320" rx="18" class="degisen"/>
    <text x="100" y="48" font-size="12" text-anchor="middle" class="degisen-text">İlk açılış</text>
    <text x="100" y="92" font-size="10" text-anchor="middle" class="degisen-text">Panel adresi</text>
    <rect x="34" y="102" width="132" height="26" fill="#fff" class="degisen"/>
    <text x="100" y="119" font-size="9" text-anchor="middle" class="degisen-text">mac.tail….ts.net</text>
    <rect x="34" y="140" width="132" height="28" class="degisen"/>
    <text x="100" y="158" font-size="11" text-anchor="middle" class="degisen-text">Bağlan</text>

    <rect x="240" y="10" width="160" height="320" rx="18" fill="#e0e0e0" stroke="#9e9e9e"/>
    <text x="320" y="48" font-size="12" text-anchor="middle" fill="#424242">Panel (değişmez)</text>
    <g fill="#bdbdbd"><rect x="252" y="62" width="62" height="40"/><rect x="326" y="62" width="62" height="40"/><rect x="252" y="110" width="62" height="40"/><rect x="326" y="110" width="62" height="40"/></g>
    <g fill="#d0d0d0" stroke="#bdbdbd"><rect x="252" y="162" width="136" height="24"/><rect x="252" y="186" width="136" height="24"/><rect x="252" y="210" width="136" height="24"/><rect x="252" y="234" width="136" height="24"/></g>

    <rect x="460" y="10" width="160" height="320" rx="18" class="degisen"/>
    <text x="540" y="48" font-size="12" text-anchor="middle" class="degisen-text">Bağlantı yok</text>
    <text x="540" y="130" font-size="11" text-anchor="middle" class="degisen-text">Mac'e ulaşılamıyor</text>
    <text x="540" y="148" font-size="9" text-anchor="middle" class="degisen-text">Mac uyuyor ya da panel kapalı</text>
    <rect x="474" y="166" width="132" height="28" class="degisen"/>
    <text x="540" y="184" font-size="11" text-anchor="middle" class="degisen-text">Yeniden dene</text>
    <text x="540" y="216" font-size="9" text-anchor="middle" class="degisen-text">Adresi değiştir</text>
  </svg>
</figure>
</body>
</html>
