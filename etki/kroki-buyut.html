<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: Kroki büyütme</title>
<style>
body{font-family:system-ui,sans-serif;color:#333;margin:1rem}figure{margin:0 0 1.25rem}
figcaption{font-size:.85rem;color:#666;margin-bottom:.35rem}
svg{display:block;width:100%;max-width:640px;height:auto;background:#f7f7f7;border:1px solid #ccc}
.degisen{stroke:#c2410c;fill:#ffedd5}.degisen-text{fill:#9a3412}
</style></head><body>
<figure><figcaption>Önce: krokiler kart içinde küçük, büyütülemez</figcaption>
<svg id="once" viewBox="0 0 640 150" role="img" aria-label="Önce: krokiler kart içinde küçük, büyütülemez">
<rect x="16" y="16" width="608" height="120" fill="#e0e0e0" stroke="#bdbdbd"/><rect x="28" y="50" width="280" height="80" fill="#e0e0e0" stroke="#bdbdbd"/><text x="36" y="44" font-size="13" fill="#616161">önce</text><rect x="324" y="50" width="280" height="80" fill="#e0e0e0" stroke="#bdbdbd"/><text x="332" y="44" font-size="13" fill="#616161">sonra</text>
</svg></figure>
<figure><figcaption>Sonra: krokiye tıklayınca tam ekran pencere; Esc ya da × kapatır</figcaption>
<svg id="sonra" viewBox="0 0 640 260" role="img" aria-label="Sonra: krokiye tıklayınca tam ekran pencere; Esc ya da × kapatır">
<rect class="degisen" x="16" y="16" width="608" height="230"/><text x="590" y="38" font-size="18" class="degisen-text">×</text><rect x="40" y="50" width="560" height="180" fill="#e0e0e0" stroke="#bdbdbd"/><text x="56" y="80" font-size="13" fill="#616161">sonra taslağı (büyük)</text><text x="56" y="220" font-size="13" class="degisen-text">imleç: büyüteç; arka plana tıklama kapatır</text>
</svg></figure>
</body></html>
