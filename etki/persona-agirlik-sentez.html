<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: Persona ağırlıklandırma ile sadeleşmiş sentez ve odak seçimi</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; color: #1e293b; margin: 1rem; background: #fff; }
  figure { margin: 0 0 1.5rem; }
  figcaption { font-size: .85rem; color: #64748b; margin-bottom: .4rem; line-height: 1.4; }
  svg { display: block; width: 100%; max-width: 780px; height: auto; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
  .degisen { stroke: #c2410c; fill: #ffedd5; }
  .degisen-text { fill: #9a3412; font-weight: bold; }
  .vurgu-rozet { fill: #ea580c; rx: 4px; }
  .emniyet-bandi { fill: #fef2f2; stroke: #ef4444; }
</style>
</head>
<body>

<figure>
  <figcaption><b>Önce:</b> Persona tartışması ve sentezinde tüm personalar eşit ağırlıktadır; odak seçimi yoktur. Çıktı çok başlıdır ve kullanıcının zihninde çelişkili önerileri sentezleme zorunluluğu (karar felci) yaratır.</figcaption>
  <svg id="once" viewBox="0 0 780 380" role="img" aria-label="Önce: Eşit ağırlıklı, odaksız persona tartışma sentezi">
    <text x="24" y="28" font-size="13" font-weight="bold" fill="#334155">TARTIŞMA & ÇÖZÜM SENTEZİ</text>

    <!-- Odak seçici yok -->
    <rect x="24" y="44" width="732" height="32" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
    <text x="36" y="65" font-size="12" fill="#64748b">Ağırlıklandırma: Eşit (1 : 1 : 1 : 1) · Odak Persona Yok</text>

    <!-- Dağınık sentez kartları -->
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="24" y="88" width="732" height="60" rx="6"/>
      <rect x="24" y="156" width="732" height="60" rx="6"/>
      <rect x="24" y="224" width="732" height="60" rx="6"/>
      <rect x="24" y="292" width="732" height="60" rx="6"/>
    </g>

    <!-- Kart içerikleri -->
    <text x="36" y="112" font-size="12" font-weight="bold" fill="#0f172a">Bilişsel Yük Bekçisi:</text>
    <text x="175" y="112" font-size="12" fill="#475569">"Girdide formül olmasın, sistem varsayılanla tek hamlede çözsün."</text>

    <text x="36" y="180" font-size="12" font-weight="bold" fill="#0f172a">Geliştirme Yöneticisi:</text>
    <text x="175" y="180" font-size="12" fill="#475569">"Adım sözdizimine `- Persona-ağırlık:` ekleyelim, hata olunca akış dursun."</text>

    <text x="36" y="248" font-size="12" font-weight="bold" fill="#0f172a">Ürün Yöneticisi:</text>
    <text x="175" y="248" font-size="12" fill="#475569">"Tüm katsayılar elle girilsin, MVP tam parametrik olsun."</text>

    <text x="36" y="316" font-size="12" font-weight="bold" fill="#0f172a">UI/UX Uzmanı:</text>
    <text x="175" y="316" font-size="12" fill="#475569">"Panelde sayısal matris ve 4 durumlu giriş formu tasarlayalım."</text>

    <text x="24" y="368" font-size="11" fill="#dc2626">⚠ 4 farklı yön ve çelişki: Net kazanan öneri yok, kullanıcı sentezi kendisi yapmak zorunda.</text>
  </svg>
</figure>

<figure>
  <figcaption><b>Sonra:</b> Tek tıkla "Odak Persona" seçilebilir; odaklı persona `×3` çarpanı alarak "Ağırlıklı Kazanan Öneri" tek bakışta öne çıkarılır. Kırmızı kapı / kota riskleri ise hiçbir ağırlığın bastıramayacağı bağımsız bir "Emniyet Katmanı"nda kilitli kalır.</figcaption>
  <svg id="sonra" viewBox="0 0 780 400" role="img" aria-label="Sonra: Odak persona seçici, emniyet bandı ve ağırlıklı kazanan öneri">
    <text x="24" y="28" font-size="13" font-weight="bold" fill="#334155">TARTIŞMA & ÇÖZÜM SENTEZİ</text>

    <!-- Değişim 1: Tek tıkla Odak Persona Seçici -->
    <g class="degisen">
      <rect x="24" y="44" width="732" height="36" rx="6" stroke-width="1.5"/>
      <text class="degisen-text" x="36" y="67" font-size="12">Odak Persona Seçimi:</text>
      <!-- Seçici butonlar / rozetler -->
      <rect x="180" y="50" width="160" height="24" fill="#ea580c" rx="4"/>
      <text x="190" y="66" font-size="11" font-weight="bold" fill="#ffffff">★ Bilişsel Yük Bekçisi (×3)</text>

      <rect x="348" y="50" width="135" height="24" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
      <text x="358" y="66" font-size="11" fill="#64748b">Geliştirme Yöneticisi</text>

      <rect x="491" y="50" width="115" height="24" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
      <text x="501" y="66" font-size="11" fill="#64748b">Ürün Yöneticisi</text>

      <rect x="614" y="50" width="100" height="24" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
      <text x="624" y="66" font-size="11" fill="#64748b">UI/UX Uzmanı</text>
    </g>

    <!-- Değişim 2: Emniyet Katmanı (Hard Gatekeeper) -->
    <rect class="emniyet-bandi" x="24" y="90" width="732" height="32" rx="6"/>
    <text x="36" y="111" font-size="11" font-weight="bold" fill="#b91c1c">🛡 BASTIRILAMAZ EMNİYET KATMANI:</text>
    <text x="240" y="111" font-size="11" fill="#991b1b">Kırmızı kapı (red gate) ve model/kota riskleri hiçbir ağırlıkla bastırılamaz (Aktif).</text>

    <!-- Değişim 3: Ağırlıklı Kazanan Öneri Kartı -->
    <g class="degisen">
      <rect x="24" y="132" width="732" height="110" rx="8" stroke-width="2"/>
      <rect x="24" y="132" width="732" height="28" fill="#ffedd5" rx="8 8 0 0"/>
      <text class="degisen-text" x="36" y="151" font-size="12">🏆 AĞIRLIKLI KAZANAN ÖNERİ (Odak: Bilişsel Yük Bekçisi ×3)</text>

      <text x="36" y="180" font-size="13" font-weight="bold" fill="#0f172a">"Varsayılan Ağırlıklar + Tek tıkla Odak Persona Modeli"</text>
      <text x="36" y="202" font-size="12" fill="#334155">Karmaşık sayısal katsayılar elendi. Sistem varsayılan katsayılarla çalışır; kullanıcı tek tıkla odağı</text>
      <text x="36" y="222" font-size="12" fill="#334155">değiştirebilir. Karar süresi %60 kısalır, gereksiz parametre bilişsel yükü sıfırlanır.</text>
    </g>

    <!-- Destekleyici persona mutabakatı (özet tek satırda) -->
    <rect x="24" y="252" width="732" height="68" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
    <text x="36" y="274" font-size="11" font-weight="bold" fill="#64748b">DİĞER PERSONALARIN MUTABAKATI:</text>
    <text x="36" y="294" font-size="11" fill="#475569">• Geliştirme Yön: "Sayısal katsayı kalkınca token ve hata yönetimi rahatlar; emniyet katmanı şart."</text>
    <text x="36" y="310" font-size="11" fill="#475569">• Ürün Yön: "Tek tıkla odak stratejik esnekliği korur, MVP hızla devreye girer." · UI/UX: "Arayüz sade kalır."</text>

    <text x="24" y="342" font-size="11" font-weight="bold" fill="#15803d">✓ Tek bakışta net karar: Kullanıcı zihninde sentez yapmak zorunda kalmaz, karar hızlanır.</text>
  </svg>
</figure>

</body>
</html>
