<!doctype html>
<html lang="tr">
<head>

<title>Etki taslağı: model × adım matrisi</title>
<style>
  body { font-family: system-ui, sans-serif; color: #333; margin: 1rem; }

  figcaption { font-size: .85rem; color: #666; margin-bottom: .35rem; }
  svg { display: block; width: 100%; max-width: 640px; height: auto; background: #f7f7f7; border: 1px solid #ccc; }
  /* tüm çizim gri tonlu; yalnızca değişen bölgeler renkli */
  .degisen { stroke: #c2410c; fill: #ffedd5; }

</style>
</head>
<body>

<figure>
  <figcaption>Önce — hangi model hangi adımda zorlandı yalnız terminalde (karsilastir.mjs), panelde model başına toplam var</figcaption>
  <svg id="once" viewBox="0 0 640 260" role="img" aria-label="Matris öncesi">
    <rect x="16" y="16" width="608" height="28" fill="#757575"/>

    <text x="24" y="100" font-size="12" fill="#616161">deepseek-v4.1-flash-free · 1 · 100%</text>
  </svg>
</figure>
