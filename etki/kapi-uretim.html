<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: kapı üretimi tablosu</title>
<style>
  body { font-family: system-ui, sans-serif; color: #333; margin: 1rem; }
  figure { margin: 0 0 1.25rem; }
  figcaption { font-size: .85rem; color: #666; margin-bottom: .35rem; }
  svg { display: block; width: 100%; max-width: 640px; height: auto;
        background: #f7f7f7; border: 1px solid #ccc; }
  .degisen { stroke: #c2410c; fill: #ffedd5; }
  .degisen-text { fill: #9a3412; }
</style>
</head>
<body>

<figure>
  <figcaption>Önce: Modeller sekmesi; kapıyı (testi) hangi modelin ne kadar iyi yazdığı hiçbir yerde görünmüyor</figcaption>
  <svg id="once" viewBox="0 0 640 400" role="img" aria-label="Kapı üretimi tablosu olmadan Modeller sekmesi">
    <text x="16" y="30" font-size="15" fill="#424242">Özet grafikler</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="40" width="296" height="70"/><rect x="328" y="40" width="296" height="70"/></g>
    <text x="16" y="138" font-size="15" fill="#424242">Görev modelleri</text>
    <rect x="16" y="148" width="608" height="24" fill="#757575"/>
    <text x="28" y="165" font-size="12" fill="#fff">görev</text><text x="160" y="165" font-size="12" fill="#fff">modeller (sırayla)</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="172" width="608" height="28"/><rect x="16" y="200" width="608" height="28"/><rect x="16" y="228" width="608" height="28"/></g>
    <g font-size="12" fill="#616161">
      <text x="28" y="190">kod</text><text x="160" y="190">deepseek-v4.1-flash · glm-5.3-flash · beam</text>
      <text x="28" y="218">kapi</text><text x="160" y="218">beam · deepseek-v4.1-flash</text>
      <text x="28" y="246">eskale</text><text x="160" y="246">longcat-2.5 · minimax-m3.1-flash · big-pickle</text>
    </g>
    <text x="16" y="290" font-size="15" fill="#424242">Modeller · ayrıntı</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="300" width="608" height="28"/><rect x="16" y="328" width="608" height="28"/></g>
    <text x="28" y="318" font-size="12" fill="#616161">kod denemeleri: model · deneme · ilk% · süre · uyum%</text>
  </svg>
</figure>

<figure>
  <figcaption>Sonra: "Görev modelleri"nin hemen altında "Kapı üretimi" tablosu; deneme sayısı hep görünür, az örnekte rozet, ret nedenleri sayıyla; kota sessizliği ayrı</figcaption>
  <svg id="sonra" viewBox="0 0 640 480" role="img" aria-label="Kapı üretimi tablosuyla Modeller sekmesi">
    <text x="16" y="30" font-size="15" fill="#424242">Özet grafikler</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="40" width="296" height="70"/><rect x="328" y="40" width="296" height="70"/></g>
    <text x="16" y="138" font-size="15" fill="#424242">Görev modelleri</text>
    <rect x="16" y="148" width="608" height="24" fill="#757575"/>
    <text x="28" y="165" font-size="12" fill="#fff">görev</text><text x="160" y="165" font-size="12" fill="#fff">modeller (sırayla)</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="172" width="608" height="28"/><rect x="16" y="200" width="608" height="28"/></g>
    <g font-size="12" fill="#616161">
      <text x="28" y="190">kod</text><text x="160" y="190">deepseek-v4.1-flash · glm-5.3-flash · beam</text>
      <text x="28" y="218">kapi</text><text x="160" y="218">beam · deepseek-v4.1-flash</text>
    </g>
    <!-- değişim: yeni bölüm -->
    <rect class="degisen" x="16" y="240" width="608" height="150" stroke-width="2"/>
    <text class="degisen-text" x="28" y="262" font-size="15">Kapı üretimi</text>
    <text class="degisen-text" x="130" y="262" font-size="11">testi kim yazdı · kabul % kod başarısı değildir</text>
    <rect x="28" y="272" width="584" height="22" fill="#757575"/>
    <g font-size="11" fill="#fff">
      <text x="36" y="287">model</text><text x="200" y="287">deneme</text><text x="260" y="287">kapı kabul</text>
      <text x="350" y="287">ret nedenleri</text><text x="500" y="287">kota</text><text x="550" y="287">ort. sn</text>
    </g>
    <g fill="#fff" stroke="#bdbdbd"><rect x="28" y="294" width="584" height="30"/><rect x="28" y="324" width="584" height="30"/></g>
    <g font-size="11" fill="#424242">
      <text x="36" y="313">beam</text><text x="210" y="313">5</text><text x="260" y="313">5 / 5 · %100</text>
      <text x="350" y="313">—</text><text x="505" y="313">0</text><text x="555" y="313">74</text>
      <text x="36" y="343">deepseek-v4.1-flash</text><text x="210" y="343">2</text>
      <text x="260" y="343">1 / 2 · %50</text>
      <text x="350" y="343">kod yazılmadan yeşil ×1</text><text x="505" y="343">0</text><text x="555" y="343">91</text>
    </g>
    <rect class="degisen" x="222" y="331" width="44" height="16" rx="8"/>
    <text class="degisen-text" x="226" y="343" font-size="9">az örnek</text>
    <text class="degisen-text" x="36" y="376" font-size="11">Boşken: "henüz kapı üretilmedi". 5'ten az denemede "az örnek" rozeti.</text>
    <text x="16" y="420" font-size="15" fill="#424242">Modeller · ayrıntı</text>
    <g fill="#e0e0e0" stroke="#bdbdbd"><rect x="16" y="430" width="608" height="28"/></g>
    <text x="28" y="448" font-size="12" fill="#616161">kod denemeleri: model · deneme · ilk% · süre · uyum%</text>
  </svg>
</figure>

</body>
</html>
