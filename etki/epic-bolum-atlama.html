<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etki taslağı: Tam sayfa Epic detayında hızlı kaydırmayla bölüm atlama</title>
<style>
  body { font-family: system-ui, sans-serif; color: #333; margin: 1rem; }
  figure { margin: 0 0 1.25rem; }
  figcaption { font-size: .85rem; color: #666; margin-bottom: .35rem; }
  svg { display: block; width: 100%; max-width: 680px; height: auto; background: #f7f7f7; border: 1px solid #ccc; }
  .degisen { stroke: #c2410c; fill: #ffedd5; }
  .degisen-text { fill: #9a3412; }
</style>
</head>
<body>

<figure>
  <figcaption>Önce: Tam sayfa Epic detayında bölüm göstergesi yoktur, uzun içerikte kaydırarak aranır, hızlı kaydırmayla bölümlere atlanamaz.</figcaption>
  <svg id="once" viewBox="0 0 680 400" role="img" aria-label="Önce: Bölüm atlamasız ve göstergesiz tam sayfa detay">
    <!-- üst çubuk -->
    <rect x="20" y="16" width="640" height="36" fill="#e0e0e0" rx="4"/>
    <text x="32" y="38" font-size="12" fill="#424242" font-weight="bold">EPIC 44 — Epic Başlığı</text>
    <text x="640" y="38" font-size="16" fill="#757575">×</text>
    <!-- içerik -->
    <text x="20" y="80" font-size="11" fill="#757575">TARTIŞMA (Tur 1, Tur 2)</text>
    <rect x="20" y="90" width="640" height="60" fill="#fff" stroke="#bdbdbd"/>
    <text x="20" y="180" font-size="11" fill="#757575">ÇÖZÜM</text>
    <rect x="20" y="190" width="640" height="60" fill="#fff" stroke="#bdbdbd"/>
    <text x="20" y="280" font-size="11" fill="#757575">UI/UX ETKİSİ</text>
    <rect x="20" y="290" width="640" height="60" fill="#fff" stroke="#bdbdbd"/>
  </svg>
</figure>

<figure>
  <figcaption>Sonra: Üst çubukta aç/kapa anahtarı; kenarda tıklanabilir mini bölüm göstergesi; hızlı kaydırmayla bir sonraki/önceki bölümün başına yumuşak geçiş ve hedef başlıkta odak vurgusu.</figcaption>
  <svg id="sonra" viewBox="0 0 680 400" role="img" aria-label="Sonra: Hızlı kaydırmayla bölüm atlama ve mini gösterge">
    <!-- üst çubukta aç/kapa ayarı -->
    <rect x="20" y="16" width="640" height="36" fill="#e0e0e0" rx="4"/>
    <text x="32" y="38" font-size="12" fill="#424242" font-weight="bold">EPIC 44 — Epic Başlığı</text>
    <rect class="degisen" x="480" y="22" width="130" height="24" rx="12"/>
    <text class="degisen-text" x="492" y="38" font-size="10" font-weight="bold">⚡ Hızlı atlama: Açık</text>
    <text x="640" y="38" font-size="16" fill="#757575">×</text>

    <!-- sağda tıklanabilir mini bölüm göstergesi -->
    <g class="degisen">
      <rect x="620" y="80" width="40" height="260" rx="8" stroke-width="1.5"/>
      <circle cx="640" cy="110" r="5" fill="#c2410c"/>
      <text class="degisen-text" x="630" y="125" font-size="8">Tur 1</text>
      <circle cx="640" cy="160" r="4" fill="#fdba74"/>
      <text class="degisen-text" x="630" y="175" font-size="8">Çözüm</text>
      <circle cx="640" cy="210" r="4" fill="#fdba74"/>
      <text class="degisen-text" x="630" y="225" font-size="8">Kroki</text>
      <circle cx="640" cy="260" r="4" fill="#fdba74"/>
      <text class="degisen-text" x="630" y="275" font-size="8">Karar</text>
    </g>

    <!-- içerik ve odak vurgusu -->
    <text x="20" y="80" font-size="11" fill="#757575">TARTIŞMA (Tur 1, Tur 2)</text>
    <rect x="20" y="90" width="585" height="60" fill="#fff" stroke="#bdbdbd"/>
    <!-- hızlı kaydırıp odaklanan bölüm -->
    <rect class="degisen" x="16" y="166" width="593" height="90" rx="6" stroke-width="2"/>
    <text class="degisen-text" x="24" y="182" font-size="12" font-weight="bold">👉 ÇÖZÜM (hızlı atlandı · yumuşak odak)</text>
    <rect x="24" y="190" width="577" height="58" fill="#fff" stroke="#c2410c"/>
    <text x="20" y="280" font-size="11" fill="#757575">UI/UX ETKİSİ</text>
    <rect x="20" y="290" width="585" height="60" fill="#fff" stroke="#bdbdbd"/>
  </svg>
</figure>

</body>
</html>
