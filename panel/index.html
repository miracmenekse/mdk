<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode-akis paneli</title>
<style>
:root {
  color-scheme: light dark;
  --zemin: #f6f7f9;
  --kart: #ffffff;
  --metin: #1c2128;
  --soluk: #5b6572;
  --cizgi: #dde1e6;
  --vurgu: #2563eb;
  --vurgu-metin: #1d4ed8;
  --maliyet: #ef4444;
  --rozet-bitti-z: #dcfce7;
  --rozet-bitti-m: #166534;
  --rozet-calisiyor-z: #dbeafe;
  --rozet-calisiyor-m: #1d4ed8;
  --rozet-bekliyor-z: #e5e7eb;
  --rozet-bekliyor-m: #4b5563;
  --rozet-eskale-z: #fef3c7;
  --rozet-eskale-m: #92400e;
  --bos: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --zemin: #111418;
    --kart: #1a1f24;
    --metin: #e6e9ec;
    --soluk: #9aa4af;
    --cizgi: #2c333a;
    --vurgu: #60a5fa;
    --vurgu-metin: #93c5fd;
    --maliyet: #f87171;
    --rozet-bitti-z: #14311f;
    --rozet-bitti-m: #86efac;
    --rozet-calisiyor-z: #172a4d;
    --rozet-calisiyor-m: #93c5fd;
    --rozet-bekliyor-z: #2c333a;
    --rozet-bekliyor-m: #b6bfc9;
    --rozet-eskale-z: #3a2e12;
    --rozet-eskale-m: #fcd34d;
    --bos: #6b7480;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--zemin);
  color: var(--metin);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 12px 14px 40px; }
h1 { font-size: 18px; margin: 10px 0 2px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--soluk); margin: 22px 0 8px; }
.baglanti { font-size: 12px; color: var(--soluk); }
.baglanti.yok { color: #b45309; font-weight: 600; }
@media (prefers-color-scheme: dark) { .baglanti.yok { color: #fbbf24; } }
.kart {
  background: var(--kart);
  border: 1px solid var(--cizgi);
  border-radius: 10px;
  padding: 12px 14px;
}
#simdi .bos { color: var(--bos); font-style: italic; }
.ana { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ana .etiket { color: var(--soluk); font-size: 12px; display: block; }
.ana b { font-size: 14px; font-weight: 600; }
.model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.rozet {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.rozet.bitti { background: var(--rozet-bitti-z); color: var(--rozet-bitti-m); }
.rozet.calisiyor { background: var(--rozet-calisiyor-z); color: var(--rozet-calisiyor-m); }
.rozet.bekliyor { background: var(--rozet-bekliyor-z); color: var(--rozet-bekliyor-m); }
.rozet.eskale { background: var(--rozet-eskale-z); color: var(--rozet-eskale-m); }
.rozet.dusuk { background: var(--rozet-eskale-z); color: var(--rozet-eskale-m); }
.rozet.orta { background: var(--rozet-calisiyor-z); color: var(--rozet-calisiyor-m); }
.rozet.yuksek { background: var(--rozet-bitti-z); color: var(--rozet-bitti-m); }
ul.adimlar { list-style: none; margin: 0; padding: 0; }
ul.adimlar li {
  background: var(--kart);
  border: 1px solid var(--cizgi);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 6px;
}
ul.adimlar li.calisiyor { border-color: var(--vurgu); }
ul.adimlar .no { color: var(--soluk); font-variant-numeric: tabular-nums; min-width: 2ch; }
.adim-ust { display: flex; align-items: center; gap: 10px; }
.adim-ust .baslik { flex: 1; min-width: 0; overflow-wrap: anywhere; }
ul.adimlar li.bitti .baslik, ul.adimlar li.bitti .no { color: var(--soluk); }
.adim-alt { color: var(--soluk); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--kart);
  border: 1px solid var(--cizgi);
  border-radius: 10px;
  overflow-x: auto;
  display: block;
}
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--cizgi); font-size: 13px; }
th { color: var(--soluk); font-weight: 600; font-size: 12px; }
tr:last-child td { border-bottom: none; }
table .model { max-width: 220px; overflow-wrap: anywhere; }
table td { white-space: nowrap; }
/* başlıklar sarılabilir; model adı harf harf kırılmasın diye en az genişlik */
table td.model, table th.model { white-space: normal; min-width: 14ch; }
td.sayi { font-variant-numeric: tabular-nums; }
/* KPI şeridi: geniş ekranda beş kutu, dar ekranda 2 sütun */
.kpi { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; }
.kpi-kutu { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.kpi-kutu .etiket { display: block; color: var(--soluk); font-size: 12px; overflow-wrap: anywhere; }
.kpi-kutu b { font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 520px) { .kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sekmeler { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--cizgi); }
.sekmeler button { font: inherit; font-size: 14px; padding: 6px 12px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--soluk); cursor: pointer; }
.sekmeler button[aria-selected="true"] { color: var(--vurgu-metin); border-bottom-color: var(--vurgu); font-weight: 600; }
#telemetri .bos { color: var(--bos); font-style: italic; }
.tasarruf { margin-bottom: 8px; font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.soluk { color: var(--soluk); font-size: 12px; }
#matris .bos { color: var(--bos); font-style: italic; }
table.matris th, table.matris td { padding: 4px 6px; text-align: center; }
table.matris th.model { text-align: left; font-weight: 400; color: var(--metin); }
.kaydir { overflow-x: auto; }
table.matris th.model { position: sticky; left: 0; background: var(--kart); z-index: 1; }
.hucre { font-size: 12px; font-weight: 600; min-width: 3ch; cursor: help; }
.hucre.ilk { background: var(--rozet-bitti-z); color: var(--rozet-bitti-m); }
.hucre.cok { background: var(--rozet-calisiyor-z); color: var(--rozet-calisiyor-m); }
.hucre.kaldi { background: var(--rozet-eskale-z); color: var(--rozet-eskale-m); }
.hucre.sessiz { background: var(--rozet-bekliyor-z); color: var(--rozet-bekliyor-m); }
.lejant { font-size: 12px; color: var(--soluk); margin: 6px 0 0; }
#etki .bos { color: var(--bos); font-style: italic; }
.etki-kart {
  background: var(--kart);
  border: 1px solid var(--cizgi);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
.etki-ust { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.etki-ust .no { color: var(--soluk); font-variant-numeric: tabular-nums; }
.etki-ust .baslik { font-weight: 600; overflow-wrap: anywhere; }
.yildiz { color: var(--vurgu); letter-spacing: .15em; white-space: nowrap; }
.tahmin { color: var(--soluk); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.dm { margin-top: 8px; font-size: 12px; color: var(--soluk); }
.dm-takip {
  display: flex;
  gap: 2px;
  height: 8px;
  margin-top: 4px;
  background: var(--cizgi);
  border-radius: 999px;
  overflow: hidden;
}
.dm-takip i { display: block; height: 100%; }
.dm-takip .deger { background: var(--vurgu); border-radius: 999px 0 0 999px; }
.dm-takip .token { background: var(--soluk); border-radius: 999px; }
.dm-satir { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.dm-satir span { width: 44px; flex: none; }
.dm-satir .dm-takip { flex: 1; margin-top: 0; }
.kroki { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.kroki > div { flex: 1 1 260px; min-width: 0; }
.kroki iframe {
  width: 100%;
  height: 300px;
  border: 1px solid var(--cizgi);
  border-radius: 8px;
  background: var(--kart);
}
.kroki .etiket { font-size: 12px; color: var(--soluk); margin-bottom: 4px; }
.hukum-kutu { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; margin: 4px 0 8px; }
#hukum { margin: 0; font-size: 13px; font-weight: 600; }
.sadece { font-size: 13px; color: var(--soluk); white-space: nowrap; }
.rozet.uyumlu { background: var(--rozet-bitti-z); color: var(--rozet-bitti-m); }
.rozet.kismen { background: var(--rozet-eskale-z); color: var(--rozet-eskale-m); }
.rozet.uyumsuz { background: var(--maliyet); color: #fff; }
.rozet.incelenmedi { background: var(--rozet-bekliyor-z); color: var(--rozet-bekliyor-m); }
/* model tablosu veri güveni; renk tek başına anlam taşımaz, simge + metin var */
.guven { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; white-space: nowrap; cursor: help; }
.guven.olculdu { background: var(--rozet-bitti-z); color: var(--rozet-bitti-m); }
.guven.kismi { background: var(--rozet-calisiyor-z); color: var(--rozet-calisiyor-m); }
.guven.tahmin { background: var(--rozet-eskale-z); color: var(--rozet-eskale-m); }
.guven.veri-yok { background: var(--rozet-bekliyor-z); color: var(--rozet-bekliyor-m); }
.sessiz { font-size: 11px; color: var(--soluk); white-space: nowrap; }
details.ayrinti { margin-top: 6px; font-size: 12px; color: var(--soluk); }
details.ayrinti summary { cursor: pointer; overflow-wrap: anywhere; }
.ayrinti-icerik { margin: 6px 0 2px 4px; padding-left: 10px; border-left: 2px solid var(--cizgi); }
.ayrinti-icerik div { margin-bottom: 3px; overflow-wrap: anywhere; }
#arastirma .bos { color: var(--bos); font-style: italic; }
#arastirma h3 { font-size: 14px; margin: 14px 0 6px; }
#depo h3 { font-size: 14px; margin: 14px 0 6px; }
#claude h3 { font-size: 14px; margin: 0 0 8px; }
#depo p { font-size: 13px; margin: 4px 0; overflow-wrap: anywhere; }
#depo a { color: var(--vurgu-metin); }
#depo .bos { color: var(--bos); font-style: italic; font-size: 13px; }
.depo-liste { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.depo-liste li { padding: 3px 0; border-bottom: 1px solid var(--cizgi); overflow-wrap: anywhere; }
.depo-liste .model { font-family: ui-monospace, SFMono-Regular, monospace; }
.depo-hata { color: var(--rozet-eskale-m); }
#depo-serit .kpi-kutu { border-color: var(--vurgu); }
#arastirma a { color: var(--vurgu-metin); overflow-wrap: anywhere; }
.ara-not, .ara-oneri { font-size: 13px; margin: 4px 0 8px; overflow-wrap: anywhere; }
.ara-not { color: var(--soluk); }
.ara-alan { font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.ara-alan span { color: var(--soluk); font-size: 12px; }
.suzgec { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.suzgec button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--cizgi); background: var(--kart); color: var(--metin); cursor: pointer; }
.suzgec button[aria-pressed="true"] { background: var(--vurgu); border-color: var(--vurgu); color: var(--kart); }
</style>
</head>
<body>
<main>
  <h1>opencode-akis</h1>
  <p class="baglanti" id="baglanti">bağlanıyor…</p>

  <section id="depo-serit"></section>
  <section id="kpi"></section>

  <div class="sekmeler" role="tablist">
    <button type="button" role="tab" data-sekme="depo" aria-selected="false" aria-controls="sekme-depo" hidden>Depo</button>
    <button type="button" role="tab" data-sekme="akis" aria-selected="true" aria-controls="sekme-akis">Akış</button>
    <button type="button" role="tab" data-sekme="modeller" aria-selected="false" aria-controls="sekme-modeller">Modeller</button>
    <button type="button" role="tab" data-sekme="etki" aria-selected="false" aria-controls="sekme-etki">Etki</button>
    <button type="button" role="tab" data-sekme="arastirma" aria-selected="false" aria-controls="sekme-arastirma">Araştırma</button>
  </div>

  <div role="tabpanel" id="sekme-depo" hidden>
  <section id="depo"></section>
  </div>

  <div role="tabpanel" id="sekme-akis">
  <h2>Şu an</h2>
  <section id="simdi" class="kart"><span class="bos">boşta</span></section>

  <h2>Adımlar</h2>
  <section id="kategoriler"></section>
  </div>

  <div role="tabpanel" id="sekme-modeller" hidden>
  <h2>Modeller</h2>
  <section id="modeller"></section>

  <h2>Gerçek token</h2>
  <section id="telemetri"></section>

  <h2>Model × adım</h2>
  <section id="matris"></section>

  <h2>Claude harcaması</h2>
  <section id="claude"></section>
  </div>

  <div role="tabpanel" id="sekme-etki" hidden>
  <h2>Etki</h2>
  <section id="etki"></section>
  </div>

  <div role="tabpanel" id="sekme-arastirma" hidden>
  <h2>Araştırma</h2>
  <div class="suzgec" id="ara-suzgec"></div>
  <section id="arastirma"><span class="bos">yükleniyor…</span></section>
  </div>
</main>

<script type="module">
import { suAnHtml, planHtml, modellerHtml, etkiHtml, arastirmaHtml, telemetriHtml, matrisHtml, kpiHtml, claudeHtml, depoSeritHtml, depoHtml } from '/ciz.mjs';

const baglantiEl = document.getElementById('baglanti');
const simdiEl = document.getElementById('simdi');
const kategorilerEl = document.getElementById('kategoriler');
const modellerEl = document.getElementById('modeller');
const etkiEl = document.getElementById('etki');
const telemetriEl = document.getElementById('telemetri');
const matrisEl = document.getElementById('matris');
const claudeEl = document.getElementById('claude');
const kpiEl = document.getElementById('kpi');
const depoSeritEl = document.getElementById('depo-serit');
const depoEl = document.getElementById('depo');
const depoDugme = document.querySelector('[data-sekme="depo"]');

// sekmeler: seçili sekme adreste (location.hash) saklanır; geçersizse açılış sekmesi
// açılış sekmesi ilk veri gelince bir kez seçilir: git deposu varsa Depo, yoksa Akış
const SEKMELER = ['depo', 'akis', 'modeller', 'etki', 'arastirma'];
let acilisSekmesi = null;
function sekmeSec() {
  const ad = location.hash.slice(1);
  const secili = SEKMELER.includes(ad) ? ad : acilisSekmesi || 'akis';
  document.querySelectorAll('[role="tab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.sekme === secili)));
  for (const k of SEKMELER) document.getElementById('sekme-' + k).hidden = k !== secili;
}
document.querySelector('[role="tablist"]').addEventListener('click', (e) => {
  const b = e.target.closest('[role="tab"]');
  if (b) location.hash = b.dataset.sekme;
});
window.addEventListener('hashchange', sekmeSec);
sekmeSec();

let sonSimdi = null;
let zamanlayici = null;
// süzgeç durumu: yeni veri gelince kutu ve satırlar bu değerden yeniden kurulur
let sadeceSorunlu = false;
// kullanıcının açıp kapattığı ayrıntılar: { [adımNo]: true|false }, her çizimde planHtml'e verilir
const acikTercih = {};

function filtreUygula() {
  const kutu = kategorilerEl.querySelector('#sadece-sorunlu');
  if (kutu) kutu.checked = sadeceSorunlu;
  kategorilerEl.querySelectorAll('li').forEach((li) => {
    li.hidden = sadeceSorunlu && li.dataset.sorunsuz === '1';
  });
}

kategorilerEl.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'sadece-sorunlu') {
    sadeceSorunlu = e.target.checked;
    filtreUygula();
  }
});

// toggle kabarcıklanmaz; yakalama aşamasında dinlenir
kategorilerEl.addEventListener('toggle', (e) => {
  if (e.target && e.target.matches && e.target.matches('details[data-no]')) {
    // varsayılanla (sorunlu = açık) aynıysa tercih sayılmaz: innerHTML ile gelen açık öğe de toggle üretebiliyor
    const varsayilan = e.target.closest('li')?.dataset.sorunlu === '1';
    if (e.target.open === varsayilan) delete acikTercih[e.target.dataset.no];
    else acikTercih[e.target.dataset.no] = e.target.open;
  }
}, true);

// sayaç yalnızca durum 'calisiyor' iken akar
function suAnCiz() {
  clearInterval(zamanlayici);
  zamanlayici = null;
  simdiEl.innerHTML = suAnHtml(sonSimdi, Date.now());
  if (sonSimdi && (sonSimdi.durum || 'calisiyor') === 'calisiyor') {
    zamanlayici = setInterval(() => {
      simdiEl.innerHTML = suAnHtml(sonSimdi, Date.now());
    }, 1000);
  }
}

function ciz(d) {
  if (d.ad) { document.querySelector('h1').textContent = d.ad; document.title = d.ad + ' paneli'; }
  depoSeritEl.innerHTML = depoSeritHtml(d.depo);
  depoEl.innerHTML = depoHtml(d.depo);
  depoDugme.hidden = !d.depo?.var;
  if (acilisSekmesi === null) {
    acilisSekmesi = d.depo?.var ? 'depo' : 'akis';
    sekmeSec();
  }
  kpiEl.innerHTML = kpiHtml(d);
  sonSimdi = d.simdi || null;
  suAnCiz();
  kategorilerEl.innerHTML = planHtml(d.plan, sonSimdi, d.gecmis, d.incelemeler, acikTercih);
  filtreUygula();
  modellerEl.innerHTML = modellerHtml(d.modeller);
  telemetriEl.innerHTML = telemetriHtml(d.telemetri);
  matrisEl.innerHTML = matrisHtml(d.matris);
  claudeEl.innerHTML = claudeHtml(d.claude);
  etkiEl.innerHTML = etkiHtml(d.etki);
}

function baglantiYok() {
  baglantiEl.textContent = 'bağlantı yok';
  baglantiEl.classList.add('yok');
}

function baglantiVar() {
  baglantiEl.textContent = 'canlı';
  baglantiEl.classList.remove('yok');
}

function dinle() {
  const es = new EventSource('/olay');
  es.onmessage = (e) => {
    try {
      ciz(JSON.parse(e.data));
      baglantiVar();
    } catch {
      baglantiYok();
    }
  };
  es.onerror = () => {
    baglantiYok();
  };
}

dinle();

// araştırma verisi canlı değil: açılışta bir kez çekilir, süzgeç yerelde çizer
const arastirmaEl = document.getElementById('arastirma');
const suzgecEl = document.getElementById('ara-suzgec');
let araVeri = null;
let araKategori = '';

function arastirmaCiz() {
  arastirmaEl.innerHTML = arastirmaHtml(araVeri, araKategori ? { kategori: araKategori } : {});
  suzgecEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === araKategori)));
}

suzgecEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  araKategori = b.dataset.k;
  arastirmaCiz();
});

fetch('/api/arastirma')
  .then((r) => r.json())
  .then((v) => {
    araVeri = v;
    const kategoriler = [...new Set((v.adaylar || []).map((a) => a.kategori).filter(Boolean))];
    if (kategoriler.length) {
      // textContent ile: kategori adları kaçışlanmış olur
      for (const k of ['', ...kategoriler]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.k = k;
        b.textContent = k || 'Tümü';
        suzgecEl.append(b);
      }
    }
    arastirmaCiz();
  })
  .catch(() => {
    arastirmaEl.innerHTML = arastirmaHtml(null);
  });
</script>
</body>
</html>
